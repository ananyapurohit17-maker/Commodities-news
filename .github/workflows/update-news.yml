name: Update commodities news

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Runs every 30 minutes.
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build commodity news page
        run: python commodities_news.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/summary_cache.json
          git diff --cached --quiet || git commit -m "Auto-update commodities news"
          git push
